<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Collections</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-alt: #f0f2f8;
      --text: #1c202a;
      --muted: #646b7d;
      --primary: #3b5bdb;
      --primary-hover: #2f4bc0;
      --border: #e2e6f0;
      --danger: #d92d20;
      --success: #067647;
      --radius: 14px;
      --shadow: 0 6px 24px rgba(28, 32, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--muted);
    }

    .badge.editor {
      background: #e6f4ea;
      color: var(--success);
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    button, select, input, textarea {
      font-family: inherit;
      font-size: 0.95rem;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-alt);
    }

    .btn-danger {
      background: #fef3f2;
      color: var(--danger);
      border-color: #fecdca;
    }

    .btn-danger:hover:not(:disabled) {
      background: #fee4e2;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .status-banner {
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .status-banner.error {
      border-color: #fecdca;
      background: #fef3f2;
      color: var(--danger);
    }

    .grid-collections {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
    }

    .card h2, .card h3 {
      margin: 0 0 6px;
      font-size: 1.15rem;
    }

    .muted {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .collection-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .collection-header-left {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex: 1;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    select,
    textarea {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      background: var(--surface);
      color: var(--text);
    }

    input[type="text"].search-input {
      min-width: 220px;
      flex: 1;
    }

    .items-list {
      display: grid;
      gap: 12px;
    }

    .item-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .item-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .tag {
      background: var(--surface-alt);
      color: var(--text);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.22);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 0.88rem;
      font-weight: 600;
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      width: 100%;
      padding-right: 42px;
    }

    .eye-btn {
      position: absolute;
      right: 6px;
      background: transparent;
      border: none;
      padding: 6px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .empty-state {
      text-align: center;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 36px 20px;
      color: var(--muted);
    }

    .editor-only {
      display: none !important;
    }

    body.is-editor .editor-only {
      display: inline-flex !important;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <h1 id="brandTitle">Mes Collections</h1>
        <span id="roleBadge" class="badge">Mode Visiteur</span>
      </div>
      <div class="header-actions">
        <button id="homeBtn" class="btn-secondary btn-sm">Accueil</button>
        <button id="newCollectionBtn" class="btn-primary btn-sm editor-only">+ Nouvelle collection</button>
        <button id="loginOpenBtn" class="btn-secondary btn-sm">Mode Éditeur</button>
        <button id="logoutBtn" class="btn-danger btn-sm editor-only">Déconnexion</button>
      </div>
    </div>
  </header>

  <main>
    <div id="statusBanner" class="status-banner">
      <span id="statusText">Chargement des collections…</span>
      <span id="authInfo" class="muted"></span>
    </div>

    <section id="homeView">
      <div id="collectionsGrid" class="grid-collections"></div>
    </section>

    <section id="collectionView" style="display: none;">
      <div class="collection-header">
        <div class="collection-header-left">
          <button id="backToHomeBtn" class="btn-secondary btn-sm">← Toutes les collections</button>
          <div>
            <h2 id="currentCollectionTitle" style="margin: 0;"></h2>
            <div id="currentCollectionDesc" class="muted"></div>
          </div>
        </div>
        <div class="card-actions">
          <button id="shareLinkBtn" class="btn-secondary btn-sm">Copier le lien</button>
          <button id="openAddItemBtn" class="btn-primary btn-sm editor-only">+ Ajouter un élément</button>
          <button id="openImportBtn" class="btn-secondary btn-sm editor-only">Importer une liste</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="toolbar-group">
          <input id="searchInput" type="text" class="search-input" placeholder="Rechercher un titre, référence, catégorie…" />
          <select id="categoryFilter">
            <option value="">Toutes les catégories</option>
          </select>
        </div>
        <div id="itemsCount" class="muted"></div>
      </div>

      <div id="itemsList" class="items-list"></div>
    </section>
  </main>

  <!-- Modale Connexion Éditeur -->
  <div id="loginModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="loginModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="loginModalTitle">Connexion Mode Éditeur</h3>
        <button id="closeLoginModal" class="btn-secondary btn-sm">✕</button>
      </div>
      <form id="loginForm" class="form-grid">
        <div class="form-field">
          <label for="editorEmailSelect">Compte enregistré</label>
          <select id="editorEmailSelect">
            <option value="camille.boissel@gmail.com">camille.boissel@gmail.com</option>
          </select>
        </div>
        <div class="form-field">
          <label for="loginEmail">Adresse e-mail</label>
          <input id="loginEmail" type="email" value="camille.boissel@gmail.com" required autocomplete="email" />
        </div>
        <div class="form-field">
          <label for="loginPassword">Mot de passe</label>
          <div class="password-wrapper">
            <input id="loginPassword" type="password" required autocomplete="current-password" />
            <button type="button" id="togglePasswordBtn" class="eye-btn" aria-label="Afficher ou masquer le mot de passe">👁</button>
          </div>
        </div>
        <div id="loginError" class="muted" style="color: var(--danger);"></div>
        <div class="modal-footer">
          <button type="button" id="cancelLoginBtn" class="btn-secondary">Annuler</button>
          <button type="submit" id="submitLoginBtn" class="btn-primary">Se connecter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modale Nouvelle Collection -->
  <div id="collectionModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="collectionModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="collectionModalTitle">Nouvelle collection</h3>
        <button id="closeCollectionModal" class="btn-secondary btn-sm">✕</button>
      </div>
      <form id="collectionForm" class="form-grid">
        <div class="form-field">
          <label for="collectionName">Nom de la collection</label>
          <input id="collectionName" type="text" placeholder="Ex. LEGO, Livres T'choupi" required />
        </div>
        <div class="form-field">
          <label for="collectionSlug">Identifiant URL (slug)</label>
          <input id="collectionSlug" type="text" placeholder="Ex. lego, tchoupi" required />
        </div>
        <div class="form-field">
          <label for="collectionDesc">Description</label>
          <textarea id="collectionDesc" rows="2" placeholder="Description courte de la collection"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelCollectionBtn" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modale Ajouter / Modifier un Élément -->
  <div id="itemModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="itemModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="itemModalTitle">Ajouter un élément</h3>
        <button id="closeItemModal" class="btn-secondary btn-sm">✕</button>
      </div>
      <form id="itemForm" class="form-grid">
        <input type="hidden" id="editingItemId" />
        <div class="form-field">
          <label for="itemTitle">Titre / Nom</label>
          <input id="itemTitle" type="text" required />
        </div>
        <div class="form-field">
          <label for="itemRef">Référence / Numéro</label>
          <input id="itemRef" type="text" placeholder="Ex. 10316, Tome 12" />
        </div>
        <div class="form-field">
          <label for="itemCategory">Catégorie</label>
          <input id="itemCategory" type="text" placeholder="Ex. Harry Potter, Seigneur des Anneaux" />
        </div>
        <div class="form-field">
          <label for="itemNotes">Notes</label>
          <textarea id="itemNotes" rows="2"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelItemBtn" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modale Importation en masse -->
  <div id="importModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="importModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 id="importModalTitle">Importer une liste</h3>
        <button id="closeImportModal" class="btn-secondary btn-sm">✕</button>
      </div>
      <form id="importForm" class="form-grid">
        <div class="form-field">
          <label for="importCategory">Catégorie par défaut (optionnel)</label>
          <input id="importCategory" type="text" placeholder="Ex. T'choupi" />
        </div>
        <div class="form-field">
          <label for="importText">Une ligne par élément (format : Titre | Référence | Catégorie | Notes)</label>
          <textarea id="importText" rows="7" placeholder="T'choupi à l'école | 001 | Classiques | Bon état&#10;Rivendell | 10316 | Seigneur des Anneaux" required></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" id="cancelImportBtn" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Importer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByzq5-OTrXDCYV1-XIuU3W5yea5nheBfU",
      authDomain: "mes-collections-15a0d.firebaseapp.com",
      projectId: "mes-collections-15a0d",
      storageBucket: "mes-collections-15a0d.firebasestorage.app",
      messagingSenderId: "598490800706",
      appId: "1:598490800706:web:314e1cc82b603207e843db",
      measurementId: "G-Y3ZRWGLMW8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const state = {
      user: null,
      collections: [],
      currentCollection: null,
      items: []
    };

    const els = {
      brandTitle: document.getElementById("brandTitle"),
      roleBadge: document.getElementById("roleBadge"),
      homeBtn: document.getElementById("homeBtn"),
      newCollectionBtn: document.getElementById("newCollectionBtn"),
      loginOpenBtn: document.getElementById("loginOpenBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      statusBanner: document.getElementById("statusBanner"),
      statusText: document.getElementById("statusText"),
      authInfo: document.getElementById("authInfo"),
      homeView: document.getElementById("homeView"),
      collectionView: document.getElementById("collectionView"),
      collectionsGrid: document.getElementById("collectionsGrid"),
      backToHomeBtn: document.getElementById("backToHomeBtn"),
      currentCollectionTitle: document.getElementById("currentCollectionTitle"),
      currentCollectionDesc: document.getElementById("currentCollectionDesc"),
      shareLinkBtn: document.getElementById("shareLinkBtn"),
      openAddItemBtn: document.getElementById("openAddItemBtn"),
      openImportBtn: document.getElementById("openImportBtn"),
      searchInput: document.getElementById("searchInput"),
      categoryFilter: document.getElementById("categoryFilter"),
      itemsCount: document.getElementById("itemsCount"),
      itemsList: document.getElementById("itemsList"),
      loginModal: document.getElementById("loginModal"),
      closeLoginModal: document.getElementById("closeLoginModal"),
      cancelLoginBtn: document.getElementById("cancelLoginBtn"),
      loginForm: document.getElementById("loginForm"),
      editorEmailSelect: document.getElementById("editorEmailSelect"),
      loginEmail: document.getElementById("loginEmail"),
      loginPassword: document.getElementById("loginPassword"),
      togglePasswordBtn: document.getElementById("togglePasswordBtn"),
      loginError: document.getElementById("loginError"),
      collectionModal: document.getElementById("collectionModal"),
      closeCollectionModal: document.getElementById("closeCollectionModal"),
      cancelCollectionBtn: document.getElementById("cancelCollectionBtn"),
      collectionForm: document.getElementById("collectionForm"),
      collectionName: document.getElementById("collectionName"),
      collectionSlug: document.getElementById("collectionSlug"),
      collectionDesc: document.getElementById("collectionDesc"),
      itemModal: document.getElementById("itemModal"),
      closeItemModal: document.getElementById("closeItemModal"),
      cancelItemBtn: document.getElementById("cancelItemBtn"),
      itemForm: document.getElementById("itemForm"),
      itemModalTitle: document.getElementById("itemModalTitle"),
      editingItemId: document.getElementById("editingItemId"),
      itemTitle: document.getElementById("itemTitle"),
      itemRef: document.getElementById("itemRef"),
      itemCategory: document.getElementById("itemCategory"),
      itemNotes: document.getElementById("itemNotes"),
      importModal: document.getElementById("importModal"),
      closeImportModal: document.getElementById("closeImportModal"),
      cancelImportBtn: document.getElementById("cancelImportBtn"),
      importForm: document.getElementById("importForm"),
      importCategory: document.getElementById("importCategory"),
      importText: document.getElementById("importText")
    };

    function setStatus(message, isError = false) {
      els.statusText.textContent = message;
      els.statusBanner.classList.toggle("error", isError);
    }

    function slugify(text) {
      return text
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function openModal(modal) {
      modal.classList.add("open");
    }

    function closeModal(modal) {
      modal.classList.remove("open");
    }

    function updateEditorUI() {
      const isEditor = Boolean(state.user);
      document.body.classList.toggle("is-editor", isEditor);
      els.roleBadge.textContent = isEditor ? "Mode Éditeur" : "Mode Visiteur";
      els.roleBadge.classList.toggle("editor", isEditor);
      els.loginOpenBtn.style.display = isEditor ? "none" : "inline-flex";
      els.authInfo.textContent = isEditor ? `Connecté : ${state.user.email}` : "Lecture publique";
      renderItems();
    }

    async function loadEditorsList() {
      try {
        const snap = await getDocs(collection(db, "editors"));
        const emails = new Set(["camille.boissel@gmail.com"]);
        snap.forEach((docSnap) => {
          const data = docSnap.data();
          if (data && data.email) {
            emails.add(data.email.trim());
          }
        });
        if (state.user && state.user.email) {
          emails.add(state.user.email.trim());
        }
        els.editorEmailSelect.innerHTML = "";
        Array.from(emails).forEach((email) => {
          const opt = document.createElement("option");
          opt.value = email;
          opt.textContent = email;
          els.editorEmailSelect.appendChild(opt);
        });
        els.editorEmailSelect.value = els.loginEmail.value || "camille.boissel@gmail.com";
      } catch (_) {}
    }

    async function loadCollections() {
      try {
        setStatus("Chargement des collections…");
        const snap = await getDocs(collection(db, "collections"));
        state.collections = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.collections.sort((a, b) => (a.name || "").localeCompare(b.name || "", "fr"));
        renderCollections();

        const params = new URLSearchParams(window.location.search);
        const requestedSlug = params.get("collection");
        if (requestedSlug) {
          const found = state.collections.find(
            (c) => (c.slug || c.id).toLowerCase() === requestedSlug.toLowerCase()
          );
          if (found) {
            await openCollection(found);
            return;
          }
        }
        showHome();
        setStatus(
          state.collections.length
            ? `${state.collections.length} collection(s) disponible(s).`
            : "Aucune collection enregistrée pour le moment."
        );
      } catch (err) {
        setStatus(`Erreur lors du chargement des collections : ${err.message}`, true);
      }
    }

    function renderCollections() {
      els.collectionsGrid.innerHTML = "";
      if (!state.collections.length) {
        els.collectionsGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <p>Aucune collection n'est encore enregistrée dans Firestore.</p>
            <p class="muted">Connecte-toi en Mode Éditeur pour créer ta première collection.</p>
          </div>
        `;
        return;
      }

      state.collections.forEach((col) => {
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <div>
            <h2>${escapeHtml(col.name || col.id)}</h2>
            <p class="muted">${escapeHtml(col.description || "Collection personnelle")}</p>
          </div>
          <div class="card-actions">
            <button type="button" class="btn-primary btn-sm open-col-btn">Ouvrir</button>
            <button type="button" class="btn-secondary btn-sm copy-col-btn">Lien</button>
          </div>
        `;
        card.querySelector(".open-col-btn").addEventListener("click", () => openCollection(col));
        card.querySelector(".copy-col-btn").addEventListener("click", () => copyCollectionLink(col));
        els.collectionsGrid.appendChild(card);
      });
    }

    async function openCollection(col) {
      state.currentCollection = col;
      const slug = col.slug || col.id;
      const url = new URL(window.location.href);
      url.searchParams.set("collection", slug);
      window.history.replaceState({}, "", url.toString());

      els.homeView.style.display = "none";
      els.collectionView.style.display = "block";
      els.currentCollectionTitle.textContent = col.name || slug;
      els.currentCollectionDesc.textContent = col.description || "";
      els.searchInput.value = "";
      els.categoryFilter.value = "";

      await loadItems(col.id);
    }

    function showHome() {
      state.currentCollection = null;
      state.items = [];
      const url = new URL(window.location.href);
      url.searchParams.delete("collection");
      window.history.replaceState({}, "", url.toString());

      els.collectionView.style.display = "none";
      els.homeView.style.display = "block";
      renderCollections();
    }

    async function loadItems(collectionId) {
      try {
        setStatus("Chargement des éléments…");
        const q = query(collection(db, "items"), where("collectionId", "==", collectionId));
        const snap = await getDocs(q);
        state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "fr"));
        populateCategories();
        renderItems();
        setStatus(`Collection « ${state.currentCollection.name || collectionId} » chargée.`);
      } catch (err) {
        setStatus(`Erreur de chargement des éléments : ${err.message}`, true);
      }
    }

    function populateCategories() {
      const currentVal = els.categoryFilter.value;
      const cats = new Set();
      state.items.forEach((item) => {
        if (item.category && item.category.trim()) {
          cats.add(item.category.trim());
        }
      });
      els.categoryFilter.innerHTML = `<option value="">Toutes les catégories</option>`;
      Array.from(cats)
        .sort((a, b) => a.localeCompare(b, "fr"))
        .forEach((cat) => {
          const opt = document.createElement("option");
          opt.value = cat;
          opt.textContent = cat;
          els.categoryFilter.appendChild(opt);
        });
      if (Array.from(cats).includes(currentVal)) {
        els.categoryFilter.value = currentVal;
      }
    }

    function renderItems() {
      if (!state.currentCollection) return;
      const term = (els.searchInput.value || "").trim().toLowerCase();
      const selectedCat = els.categoryFilter.value;

      const filtered = state.items.filter((item) => {
        const matchesCat = !selectedCat || (item.category || "").trim() === selectedCat;
        const haystack = `${item.title || ""} ${item.ref || ""} ${item.category || ""} ${item.notes || ""}`.toLowerCase();
        const matchesTerm = !term || haystack.includes(term);
        return matchesCat && matchesTerm;
      });

      els.itemsCount.textContent = `${filtered.length} élément(s)`;
      els.itemsList.innerHTML = "";

      if (!filtered.length) {
        els.itemsList.innerHTML = `
          <div class="empty-state">
            Aucun élément ne correspond à votre affichage actuel.
          </div>
        `;
        return;
      }

      filtered.forEach((item) => {
        const row = document.createElement("div");
        row.className = "item-row";
        row.innerHTML = `
          <div class="item-main">
            <div class="item-title">${escapeHtml(item.title || "Sans titre")}</div>
            <div class="item-meta">
              ${item.ref ? `<span class="tag">Réf. ${escapeHtml(item.ref)}</span>` : ""}
              ${item.category ? `<span class="tag">${escapeHtml(item.category)}</span>` : ""}
              ${item.notes ? `<span>${escapeHtml(item.notes)}</span>` : ""}
            </div>
          </div>
          <div class="card-actions editor-only">
            <button type="button" class="btn-secondary btn-sm edit-item-btn">Modifier</button>
            <button type="button" class="btn-danger btn-sm delete-item-btn">Supprimer</button>
          </div>
        `;

        row.querySelector(".edit-item-btn").addEventListener("click", () => openEditItemModal(item));
        row.querySelector(".delete-item-btn").addEventListener("click", () => deleteItem(item));
        els.itemsList.appendChild(row);
      });
    }

    function copyCollectionLink(col) {
      const slug = col.slug || col.id;
      const url = new URL(window.location.href);
      url.searchParams.set("collection", slug);
      navigator.clipboard?.writeText(url.toString()).then(
        () => setStatus(`Lien copié : ${url.toString()}`),
        () => setStatus(`Lien de partage : ${url.toString()}`)
      );
    }

    function openEditItemModal(item) {
      els.itemModalTitle.textContent = "Modifier un élément";
      els.editingItemId.value = item.id;
      els.itemTitle.value = item.title || "";
      els.itemRef.value = item.ref || "";
      els.itemCategory.value = item.category || "";
      els.itemNotes.value = item.notes || "";
      openModal(els.itemModal);
    }

    async function deleteItem(item) {
      if (!state.user) return;
      if (!confirm(`Supprimer « ${item.title || "cet élément"} » ?`)) return;
      try {
        await deleteDoc(doc(db, "items", item.id));
        state.items = state.items.filter((i) => i.id !== item.id);
        populateCategories();
        renderItems();
        setStatus("Élément supprimé.");
      } catch (err) {
        setStatus(`Erreur lors de la suppression : ${err.message}`, true);
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    els.brandTitle.addEventListener("click", showHome);
    els.homeBtn.addEventListener("click", showHome);
    els.backToHomeBtn.addEventListener("click", showHome);
    els.shareLinkBtn.addEventListener("click", () => {
      if (state.currentCollection) copyCollectionLink(state.currentCollection);
    });
    els.searchInput.addEventListener("input", renderItems);
    els.categoryFilter.addEventListener("change", renderItems);

    els.loginOpenBtn.addEventListener("click", async () => {
      els.loginError.textContent = "";
      els.loginPassword.value = "";
      await loadEditorsList();
      openModal(els.loginModal);
    });

    els.closeLoginModal.addEventListener("click", () => closeModal(els.loginModal));
    els.cancelLoginBtn.addEventListener("click", () => closeModal(els.loginModal));

    els.editorEmailSelect.addEventListener("change", () => {
      els.loginEmail.value = els.editorEmailSelect.value;
    });

    els.togglePasswordBtn.addEventListener("click", () => {
      const isPass = els.loginPassword.type === "password";
      els.loginPassword.type = isPass ? "text" : "password";
    });

    els.loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      els.loginError.textContent = "";
      const email = els.loginEmail.value.trim();
      const password = els.loginPassword.value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        try {
          await setDoc(
            doc(db, "editors", cred.user.uid),
            { email: cred.user.email, updatedAt: serverTimestamp() },
            { merge: true }
          );
        } catch (_) {}
        closeModal(els.loginModal);
        setStatus(`Connecté en Mode Éditeur (${cred.user.email}).`);
      } catch (err) {
        els.loginError.textContent = `Connexion impossible : ${err.message}`;
      }
    });

    els.logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      setStatus("Déconnecté — retour en Mode Visiteur.");
    });

    els.newCollectionBtn.addEventListener("click", () => {
      els.collectionForm.reset();
      delete els.collectionSlug.dataset.manual;
      openModal(els.collectionModal);
    });

    els.collectionName.addEventListener("input", () => {
      if (!els.collectionSlug.dataset.manual) {
        els.collectionSlug.value = slugify(els.collectionName.value);
      }
    });

    els.collectionSlug.addEventListener("input", () => {
      els.collectionSlug.dataset.manual = "true";
      els.collectionSlug.value = slugify(els.collectionSlug.value);
    });

    els.closeCollectionModal.addEventListener("click", () => closeModal(els.collectionModal));
    els.cancelCollectionBtn.addEventListener("click", () => closeModal(els.collectionModal));

    els.collectionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.user) return;
      const name = els.collectionName.value.trim();
      const slug = slugify(els.collectionSlug.value || name);
      const description = els.collectionDesc.value.trim();
      if (!name || !slug) return;

      try {
        const docRef = doc(db, "collections", slug);
        const payload = {
          name,
          slug,
          description,
          updatedAt: serverTimestamp()
        };
        await setDoc(docRef, payload, { merge: true });
        closeModal(els.collectionModal);
        await loadCollections();
        setStatus(`Collection « ${name} » enregistrée.`);
      } catch (err) {
        setStatus(`Erreur création collection : ${err.message}`, true);
      }
    });

    els.openAddItemBtn.addEventListener("click", () => {
      els.itemModalTitle.textContent = "Ajouter un élément";
      els.editingItemId.value = "";
      els.itemForm.reset();
      openModal(els.itemModal);
    });

    els.closeItemModal.addEventListener("click", () => closeModal(els.itemModal));
    els.cancelItemBtn.addEventListener("click", () => closeModal(els.itemModal));

    els.itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.user || !state.currentCollection) return;

      const id = els.editingItemId.value;
      const data = {
        collectionId: state.currentCollection.id,
        title: els.itemTitle.value.trim(),
        ref: els.itemRef.value.trim(),
        category: els.itemCategory.value.trim(),
        notes: els.itemNotes.value.trim(),
        updatedAt: serverTimestamp()
      };

      try {
        if (id) {
          await updateDoc(doc(db, "items", id), data);
          const idx = state.items.findIndex((i) => i.id === id);
          if (idx !== -1) state.items[idx] = { id, ...data };
        } else {
          data.createdAt = serverTimestamp();
          const created = await addDoc(collection(db, "items"), data);
          state.items.push({ id: created.id, ...data });
        }
        state.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "fr"));
        populateCategories();
        renderItems();
        closeModal(els.itemModal);
        setStatus("Élément enregistré dans Firestore.");
      } catch (err) {
        setStatus(`Erreur d'enregistrement : ${err.message}`, true);
      }
    });

    els.openImportBtn.addEventListener("click", () => {
      els.importForm.reset();
      openModal(els.importModal);
    });

    els.closeImportModal.addEventListener("click", () => closeModal(els.importModal));
    els.cancelImportBtn.addEventListener("click", () => closeModal(els.importModal));

    els.importForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.user || !state.currentCollection) return;

      const defaultCat = els.importCategory.value.trim();
      const lines = els.importText.value
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter(Boolean);

      if (!lines.length) return;

      try {
        let count = 0;
        for (const line of lines) {
          const parts = line.split("|").map((p) => p.trim());
          const title = parts[0];
          if (!title) continue;
          const itemData = {
            collectionId: state.currentCollection.id,
            title,
            ref: parts[1] || "",
            category: parts[2] || defaultCat || "",
            notes: parts[3] || "",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          };
          const created = await addDoc(collection(db, "items"), itemData);
          state.items.push({ id: created.id, ...itemData });
          count += 1;
        }
        state.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "fr"));
        populateCategories();
        renderItems();
        closeModal(els.importModal);
        setStatus(`${count} élément(s) importé(s) dans Firestore.`);
      } catch (err) {
        setStatus(`Erreur lors de l'importation : ${err.message}`, true);
      }
    });

    onAuthStateChanged(auth, async (user) => {
      state.user = user;
      updateEditorUI();
      await loadEditorsList();
    });

    loadCollections();
  </script>
</body>
</html>
