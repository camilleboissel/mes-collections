<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Collections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f5f9;
      --surface: #ffffff;
      --surface-soft: #f8f9fc;
      --ink: #171923;
      --ink-muted: #5f667a;
      --line: #e6e9f2;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef2ff;
      --success-bg: #ecfdf3;
      --success-ink: #027a48;
      --danger-bg: #fef3f2;
      --danger-ink: #b42318;
      --shadow-sm: 0 2px 10px rgba(23, 25, 35, 0.04);
      --shadow-md: 0 12px 32px rgba(23, 25, 35, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 9px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top right, #eef2ff 0%, var(--bg) 42%);
      color: var(--ink);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(12px);
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 1.05rem;
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .brand-title {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--surface-soft);
      color: var(--ink-muted);
      border: 1px solid var(--line);
    }

    .mode-pill.editor {
      background: var(--success-bg);
      color: var(--success-ink);
      border-color: #abefc6;
    }

    .nav-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 9px 15px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.16s ease;
    }

    .btn-sm {
      padding: 7px 12px;
      font-size: 0.83rem;
      border-radius: 8px;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line);
    }

    .btn-ghost:hover {
      background: var(--surface-soft);
      border-color: #d0d5e3;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-ink);
      border-color: #fecdca;
    }

    .btn-danger:hover {
      background: #fee4e2;
    }

    .container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 24px 72px;
    }

    .hero-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .hero-head h2 {
      margin: 0 0 4px;
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    .hero-head p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.95rem;
    }

    .notice-bar {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--ink-muted);
      box-shadow: var(--shadow-sm);
    }

    .notice-bar.error {
      background: var(--danger-bg);
      border-color: #fecdca;
      color: var(--danger-ink);
    }

    .collections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .collection-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 18px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .collection-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .collection-tag {
      display: inline-block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 9px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .collection-card h3 {
      margin: 0 0 6px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .collection-card p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }

    .card-footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collection-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
    }

    .collection-title-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .collection-title-wrap h2 {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 800;
    }

    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .filter-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      flex: 1;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select,
    textarea {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.92rem;
      color: var(--ink);
      background: var(--surface);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .search-box {
      flex: 1;
      min-width: 220px;
    }

    .item-stack {
      display: grid;
      gap: 12px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }

    .item-title {
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .item-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--ink-muted);
    }

    .chip {
      background: var(--surface-soft);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .empty-box {
      background: var(--surface);
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius-lg);
      padding: 44px 24px;
      text-align: center;
      color: var(--ink-muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 60;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--surface);
      border-radius: var(--radius-lg);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-md);
      padding: 24px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .modal-head h3 {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .field-stack {
      display: grid;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.86rem;
      font-weight: 700;
    }

    .pass-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pass-wrap input {
      width: 100%;
      padding-right: 42px;
    }

    .pass-eye {
      position: absolute;
      right: 6px;
      background: transparent;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 6px;
      font-size: 0.95rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .editor-only {
      display: none !important;
    }

    body.is-editor .editor-only {
      display: inline-flex !important;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div id="brandArea" class="brand-area">
        <div class="brand-mark">C</div>
        <h1 class="brand-title">Mes Collections</h1>
        <span id="modeBadge" class="mode-pill">Mode Visiteur</span>
      </div>
      <div class="nav-actions">
        <button id="homeNavBtn" type="button" class="btn btn-ghost btn-sm">Accueil</button>
        <button id="createCollectionBtn" type="button" class="btn btn-primary btn-sm editor-only">+ Nouvelle collection</button>
        <button id="openLoginBtn" type="button" class="btn btn-ghost btn-sm">Mode Éditeur</button>
        <button id="logoutBtn" type="button" class="btn btn-danger btn-sm editor-only">Déconnexion</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="noticeBar" class="notice-bar">
      <span id="noticeText">Chargement de vos collections…</span>
      <span id="sessionLabel">Consultation publique</span>
    </div>

    <section id="homeSection">
      <div class="hero-head">
        <div>
          <h2>Vos collections</h2>
          <p>Retrouvez vos listes organisées, filtrez vos éléments et partagez un lien direct.</p>
        </div>
      </div>
      <div id="collectionsGrid" class="collections-grid"></div>
    </section>

    <section id="collectionSection" style="display: none;">
      <div class="collection-top">
        <div class="collection-title-wrap">
          <button id="backBtn" type="button" class="btn btn-ghost btn-sm">← Retour</button>
          <div>
            <h2 id="detailTitle"></h2>
            <p id="detailDesc" style="margin: 2px 0 0; color: var(--ink-muted); font-size: 0.92rem;"></p>
          </div>
        </div>
        <div class="card-footer-actions">
          <button id="copyShareBtn" type="button" class="btn btn-ghost btn-sm">Copier le lien</button>
          <button id="addItemBtn" type="button" class="btn btn-primary btn-sm editor-only">+ Ajouter un élément</button>
          <button id="importListBtn" type="button" class="btn btn-ghost btn-sm editor-only">Importer une liste</button>
        </div>
      </div>

      <div class="filter-panel">
        <div class="filter-inputs">
          <input id="searchField" type="text" class="search-box" placeholder="Rechercher par titre, référence ou catégorie…" />
          <select id="categorySelect">
            <option value="">Toutes les catégories</option>
          </select>
        </div>
        <span id="countLabel" style="font-size: 0.88rem; font-weight: 600; color: var(--ink-muted);"></span>
      </div>

      <div id="itemsContainer" class="item-stack"></div>
    </section>
  </main>

  <!-- Connexion Éditeur -->
  <div id="loginModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Connexion Mode Éditeur</h3>
        <button id="closeLoginBtn" type="button" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <form id="loginForm" class="field-stack">
        <div class="field">
          <label for="emailInput">Adresse e-mail</label>
          <input id="emailInput" type="email" value="camille.boissel@gmail.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="passwordInput">Mot de passe</label>
          <div class="pass-wrap">
            <input id="passwordInput" type="password" required autocomplete="current-password" />
            <button id="togglePassBtn" type="button" class="pass-eye" aria-label="Afficher le mot de passe">👁</button>
          </div>
        </div>
        <div id="loginErrorMsg" style="font-size: 0.86rem; color: var(--danger-ink);"></div>
        <div class="modal-actions">
          <button id="cancelLoginBtn" type="button" class="btn btn-ghost">Annuler</button>
          <button type="submit" class="btn btn-primary">Se connecter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Nouvelle collection -->
  <div id="collectionModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Nouvelle collection</h3>
        <button id="closeCollectionBtn" type="button" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <form id="collectionForm" class="field-stack">
        <div class="field">
          <label for="colNameInput">Nom de la collection</label>
          <input id="colNameInput" type="text" placeholder="Ex. LEGO, Livres T'choupi" required />
        </div>
        <div class="field">
          <label for="colSlugInput">Identifiant URL</label>
          <input id="colSlugInput" type="text" placeholder="Ex. lego, tchoupi" required />
        </div>
        <div class="field">
          <label for="colDescInput">Description</label>
          <textarea id="colDescInput" rows="2" placeholder="Courte description"></textarea>
        </div>
        <div class="modal-actions">
          <button id="cancelCollectionBtn" type="button" class="btn btn-ghost">Annuler</button>
          <button type="submit" class="btn btn-primary">Créer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Ajouter / Modifier un élément -->
  <div id="itemModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="itemModalHeading">Ajouter un élément</h3>
        <button id="closeItemBtn" type="button" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <form id="itemForm" class="field-stack">
        <input id="itemIdField" type="hidden" />
        <div class="field">
          <label for="itemTitleField">Titre</label>
          <input id="itemTitleField" type="text" required />
        </div>
        <div class="field">
          <label for="itemRefField">Référence</label>
          <input id="itemRefField" type="text" placeholder="Ex. 10316, Tome 4" />
        </div>
        <div class="field">
          <label for="itemCatField">Catégorie</label>
          <input id="itemCatField" type="text" placeholder="Ex. Harry Potter, Classiques" />
        </div>
        <div class="field">
          <label for="itemNotesField">Notes</label>
          <textarea id="itemNotesField" rows="2"></textarea>
        </div>
        <div class="modal-actions">
          <button id="cancelItemBtn" type="button" class="btn btn-ghost">Annuler</button>
          <button type="submit" class="btn btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Importer une liste -->
  <div id="importModal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Importer une liste</h3>
        <button id="closeImportBtn" type="button" class="btn btn-ghost btn-sm">✕</button>
      </div>
      <form id="importForm" class="field-stack">
        <div class="field">
          <label for="importDefaultCat">Catégorie par défaut (optionnel)</label>
          <input id="importDefaultCat" type="text" placeholder="Ex. LEGO ou T'choupi" />
        </div>
        <div class="field">
          <label for="importLinesArea">Une ligne par élément (Titre | Référence | Catégorie | Notes)</label>
          <textarea id="importLinesArea" rows="7" placeholder="Le château de Poudlard : la grande salle | 76435 | Harry Potter | 10+, 1732 pièces&#10;T'choupi à l'école | 001 | Classiques" required></textarea>
        </div>
        <div class="modal-actions">
          <button id="cancelImportBtn" type="button" class="btn btn-ghost">Annuler</button>
          <button type="submit" class="btn btn-primary">Importer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      getDocs,
      setDoc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      where,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyByzq5-OTrXDCYV1-XIuU3W5yea5nheBfU",
      authDomain: "mes-collections-15a0d.firebaseapp.com",
      projectId: "mes-collections-15a0d",
      storageBucket: "mes-collections-15a0d.firebasestorage.app",
      messagingSenderId: "598490800706",
      appId: "1:598490800706:web:314e1cc82b603207e843db",
      measurementId: "G-Y3ZRWGLMW8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const state = {
      user: null,
      collections: [],
      activeCollection: null,
      items: []
    };

    const ui = {
      brandArea: document.getElementById("brandArea"),
      modeBadge: document.getElementById("modeBadge"),
      homeNavBtn: document.getElementById("homeNavBtn"),
      createCollectionBtn: document.getElementById("createCollectionBtn"),
      openLoginBtn: document.getElementById("openLoginBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      noticeBar: document.getElementById("noticeBar"),
      noticeText: document.getElementById("noticeText"),
      sessionLabel: document.getElementById("sessionLabel"),
      homeSection: document.getElementById("homeSection"),
      collectionSection: document.getElementById("collectionSection"),
      collectionsGrid: document.getElementById("collectionsGrid"),
      backBtn: document.getElementById("backBtn"),
      detailTitle: document.getElementById("detailTitle"),
      detailDesc: document.getElementById("detailDesc"),
      copyShareBtn: document.getElementById("copyShareBtn"),
      addItemBtn: document.getElementById("addItemBtn"),
      importListBtn: document.getElementById("importListBtn"),
      searchField: document.getElementById("searchField"),
      categorySelect: document.getElementById("categorySelect"),
      countLabel: document.getElementById("countLabel"),
      itemsContainer: document.getElementById("itemsContainer"),
      loginModal: document.getElementById("loginModal"),
      closeLoginBtn: document.getElementById("closeLoginBtn"),
      cancelLoginBtn: document.getElementById("cancelLoginBtn"),
      loginForm: document.getElementById("loginForm"),
      emailInput: document.getElementById("emailInput"),
      passwordInput: document.getElementById("passwordInput"),
      togglePassBtn: document.getElementById("togglePassBtn"),
      loginErrorMsg: document.getElementById("loginErrorMsg"),
      collectionModal: document.getElementById("collectionModal"),
      closeCollectionBtn: document.getElementById("closeCollectionBtn"),
      cancelCollectionBtn: document.getElementById("cancelCollectionBtn"),
      collectionForm: document.getElementById("collectionForm"),
      colNameInput: document.getElementById("colNameInput"),
      colSlugInput: document.getElementById("colSlugInput"),
      colDescInput: document.getElementById("colDescInput"),
      itemModal: document.getElementById("itemModal"),
      closeItemBtn: document.getElementById("closeItemBtn"),
      cancelItemBtn: document.getElementById("cancelItemBtn"),
      itemForm: document.getElementById("itemForm"),
      itemModalHeading: document.getElementById("itemModalHeading"),
      itemIdField: document.getElementById("itemIdField"),
      itemTitleField: document.getElementById("itemTitleField"),
      itemRefField: document.getElementById("itemRefField"),
      itemCatField: document.getElementById("itemCatField"),
      itemNotesField: document.getElementById("itemNotesField"),
      importModal: document.getElementById("importModal"),
      closeImportBtn: document.getElementById("closeImportBtn"),
      cancelImportBtn: document.getElementById("cancelImportBtn"),
      importForm: document.getElementById("importForm"),
      importDefaultCat: document.getElementById("importDefaultCat"),
      importLinesArea: document.getElementById("importLinesArea")
    };

    function setNotice(text, isError = false) {
      ui.noticeText.textContent = text;
      ui.noticeBar.classList.toggle("error", isError);
    }

    function makeSlug(str) {
      return str
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function esc(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function openDialog(el) {
      el.classList.add("open");
    }

    function closeDialog(el) {
      el.classList.remove("open");
    }

    function syncRoleUI() {
      const editor = Boolean(state.user);
      document.body.classList.toggle("is-editor", editor);
      ui.modeBadge.textContent = editor ? "Mode Éditeur" : "Mode Visiteur";
      ui.modeBadge.classList.toggle("editor", editor);
      ui.openLoginBtn.style.display = editor ? "none" : "inline-flex";
      ui.sessionLabel.textContent = editor ? `Connecté : ${state.user.email}` : "Consultation publique";
      renderItems();
    }

    async function loadCollections() {
      try {
        setNotice("Chargement de vos collections…");
        const snap = await getDocs(collection(db, "collections"));
        state.collections = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.collections.sort((a, b) => (a.name || "").localeCompare(b.name || "", "fr"));
        renderCollections();

        const slugParam = new URLSearchParams(window.location.search).get("collection");
        if (slugParam) {
          const match = state.collections.find(
            (c) => (c.slug || c.id).toLowerCase() === slugParam.toLowerCase()
          );
          if (match) {
            await openCollection(match);
            return;
          }
        }
        showHome();
        setNotice(
          state.collections.length
            ? `${state.collections.length} collection(s) prête(s).`
            : "Aucune collection enregistrée pour l'instant."
        );
      } catch (err) {
        setNotice(`Erreur chargement collections : ${err.message}`, true);
      }
    }

    function renderCollections() {
      ui.collectionsGrid.innerHTML = "";
      if (!state.collections.length) {
        ui.collectionsGrid.innerHTML = `
          <div class="empty-box" style="grid-column: 1 / -1;">
            <p style="margin: 0 0 6px; font-weight: 700; color: var(--ink);">Aucune collection pour le moment</p>
            <p style="margin: 0; font-size: 0.9rem;">Passe en Mode Éditeur pour créer ta première collection.</p>
          </div>
        `;
        return;
      }

      state.collections.forEach((col) => {
        const card = document.createElement("article");
        card.className = "collection-card";
        card.innerHTML = `
          <div>
            <span class="collection-tag">${esc(col.slug || col.id)}</span>
            <h3>${esc(col.name || col.id)}</h3>
            <p>${esc(col.description || "Collection personnelle")}</p>
          </div>
          <div class="card-footer-actions">
            <button type="button" class="btn btn-primary btn-sm open-btn">Ouvrir</button>
            <button type="button" class="btn btn-ghost btn-sm share-btn">Lien</button>
          </div>
        `;
        card.querySelector(".open-btn").addEventListener("click", () => openCollection(col));
        card.querySelector(".share-btn").addEventListener("click", () => copyShareUrl(col));
        ui.collectionsGrid.appendChild(card);
      });
    }

    async function openCollection(col) {
      state.activeCollection = col;
      const slug = col.slug || col.id;
      const url = new URL(window.location.href);
      url.searchParams.set("collection", slug);
      window.history.replaceState({}, "", url.toString());

      ui.homeSection.style.display = "none";
      ui.collectionSection.style.display = "block";
      ui.detailTitle.textContent = col.name || slug;
      ui.detailDesc.textContent = col.description || "";
      ui.searchField.value = "";
      ui.categorySelect.value = "";

      await loadItems(col.id);
    }

    function showHome() {
      state.activeCollection = null;
      state.items = [];
      const url = new URL(window.location.href);
      url.searchParams.delete("collection");
      window.history.replaceState({}, "", url.toString());

      ui.collectionSection.style.display = "none";
      ui.homeSection.style.display = "block";
      renderCollections();
    }

    async function loadItems(collectionId) {
      try {
        setNotice("Chargement des éléments…");
        const q = query(collection(db, "items"), where("collectionId", "==", collectionId));
        const snap = await getDocs(q);
        state.items = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "fr"));
        buildCategoryOptions();
        renderItems();
        setNotice(`Collection « ${state.activeCollection.name || collectionId} » affichée.`);
      } catch (err) {
        setNotice(`Erreur chargement éléments : ${err.message}`, true);
      }
    }

    function buildCategoryOptions() {
      const prev = ui.categorySelect.value;
      const cats = new Set();
      state.items.forEach((it) => {
        if (it.category && it.category.trim()) cats.add(it.category.trim());
      });
      ui.categorySelect.innerHTML = `<option value="">Toutes les catégories</option>`;
      Array.from(cats)
        .sort((a, b) => a.localeCompare(b, "fr"))
        .forEach((c) => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          ui.categorySelect.appendChild(opt);
        });
      if (Array.from(cats).includes(prev)) ui.categorySelect.value = prev;
    }

    function renderItems() {
      if (!state.activeCollection) return;
      const qText = (ui.searchField.value || "").trim().toLowerCase();
      const qCat = ui.categorySelect.value;

      const list = state.items.filter((it) => {
        const okCat = !qCat || (it.category || "").trim() === qCat;
        const blob = `${it.title || ""} ${it.ref || ""} ${it.category || ""} ${it.notes || ""}`.toLowerCase();
        const okText = !qText || blob.includes(qText);
        return okCat && okText;
      });

      ui.countLabel.textContent = `${list.length} élément(s)`;
      ui.itemsContainer.innerHTML = "";

      if (!list.length) {
        ui.itemsContainer.innerHTML = `<div class="empty-box">Aucun élément trouvé dans cette vue.</div>`;
        return;
      }

      list.forEach((it) => {
        const row = document.createElement("div");
        row.className = "item-card";
        row.innerHTML = `
          <div>
            <div class="item-title">${esc(it.title || "Sans titre")}</div>
            <div class="item-badges">
              ${it.ref ? `<span class="chip">Réf. ${esc(it.ref)}</span>` : ""}
              ${it.category ? `<span class="chip">${esc(it.category)}</span>` : ""}
              ${it.notes ? `<span>${esc(it.notes)}</span>` : ""}
            </div>
          </div>
          <div class="card-footer-actions editor-only">
            <button type="button" class="btn btn-ghost btn-sm edit-btn">Modifier</button>
            <button type="button" class="btn btn-danger btn-sm del-btn">Supprimer</button>
          </div>
        `;
        row.querySelector(".edit-btn").addEventListener("click", () => startEditItem(it));
        row.querySelector(".del-btn").addEventListener("click", () => removeItem(it));
        ui.itemsContainer.appendChild(row);
      });
    }

    function copyShareUrl(col) {
      const slug = col.slug || col.id;
      const url = new URL(window.location.href);
      url.searchParams.set("collection", slug);
      navigator.clipboard?.writeText(url.toString()).then(
        () => setNotice(`Lien copié : ${url.toString()}`),
        () => setNotice(`Lien : ${url.toString()}`)
      );
    }

    function startEditItem(it) {
      ui.itemModalHeading.textContent = "Modifier un élément";
      ui.itemIdField.value = it.id;
      ui.itemTitleField.value = it.title || "";
      ui.itemRefField.value = it.ref || "";
      ui.itemCatField.value = it.category || "";
      ui.itemNotesField.value = it.notes || "";
      openDialog(ui.itemModal);
    }

    async function removeItem(it) {
      if (!state.user) return;
      if (!confirm(`Supprimer « ${it.title || "cet élément"} » ?`)) return;
      try {
        await deleteDoc(doc(db, "items", it.id));
        state.items = state.items.filter((x) => x.id !== it.id);
        buildCategoryOptions();
        renderItems();
        setNotice("Élément supprimé.");
      } catch (err) {
        setNotice(`Erreur suppression : ${err.message}`, true);
      }
    }

    ui.brandArea.addEventListener("click", showHome);
    ui.homeNavBtn.addEventListener("click", showHome);
    ui.backBtn.addEventListener("click", showHome);
    ui.copyShareBtn.addEventListener("click", () => {
      if (state.activeCollection) copyShareUrl(state.activeCollection);
    });
    ui.searchField.addEventListener("input", renderItems);
    ui.categorySelect.addEventListener("change", renderItems);

    ui.openLoginBtn.addEventListener("click", () => {
      ui.loginErrorMsg.textContent = "";
      ui.passwordInput.value = "";
      openDialog(ui.loginModal);
    });
    ui.closeLoginBtn.addEventListener("click", () => closeDialog(ui.loginModal));
    ui.cancelLoginBtn.addEventListener("click", () => closeDialog(ui.loginModal));
    ui.togglePassBtn.addEventListener("click", () => {
      ui.passwordInput.type = ui.passwordInput.type === "password" ? "text" : "password";
    });

    ui.loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      ui.loginErrorMsg.textContent = "";
      try {
        const cred = await signInWithEmailAndPassword(
          auth,
          ui.emailInput.value.trim(),
          ui.passwordInput.value
        );
        closeDialog(ui.loginModal);
        setNotice(`Connecté en Mode Éditeur (${cred.user.email}).`);
      } catch (err) {
        ui.loginErrorMsg.textContent = `Connexion impossible : ${err.message}`;
      }
    });

    ui.logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      setNotice("Déconnecté — retour en Mode Visiteur.");
    });

    ui.createCollectionBtn.addEventListener("click", () => {
      ui.collectionForm.reset();
      delete ui.colSlugInput.dataset.manual;
      openDialog(ui.collectionModal);
    });
    ui.colNameInput.addEventListener("input", () => {
      if (!ui.colSlugInput.dataset.manual) ui.colSlugInput.value = makeSlug(ui.colNameInput.value);
    });
    ui.colSlugInput.addEventListener("input", () => {
      ui.colSlugInput.dataset.manual = "true";
      ui.colSlugInput.value = makeSlug(ui.colSlugInput.value);
    });
    ui.closeCollectionBtn.addEventListener("click", () => closeDialog(ui.collectionModal));
    ui.cancelCollectionBtn.addEventListener("click", () => closeDialog(ui.collectionModal));

    ui.collectionForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.user) return;
      const name = ui.colNameInput.value.trim();
      const slug = makeSlug(ui.colSlugInput.value || name);
      const description = ui.colDescInput.value.trim();
      if (!name || !slug) return;
      try {
        await setDoc(doc(db, "collections", slug), {
          name,
          slug,
          description,
          updatedAt: serverTimestamp()
        }, { merge: true });
        closeDialog(ui.collectionModal);
        await loadCollections();
        setNotice(`Collection « ${name} » enregistrée.`);
      } catch (err) {
        setNotice(`Erreur création collection : ${err.message}`, true);
      }
    });

    ui.addItemBtn.addEventListener("click", () => {
      ui.itemModalHeading.textContent = "Ajouter un élément";
      ui.itemIdField.value = "";
      ui.itemForm.reset();
      openDialog(ui.itemModal);
    });
    ui.closeItemBtn.addEventListener("click", () => closeDialog(ui.itemModal));
    ui.cancelItemBtn.addEventListener("click", () => closeDialog(ui.itemModal));

    ui.itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.user || !state.activeCollection) return;
      const id = ui.itemIdField.value;
      const payload = {
        collectionId: state.activeCollection.id,
        title: ui.itemTitleField.value.trim(),
        ref: ui.itemRefField.value.trim(),
        category: ui.itemCatField.value.trim(),
        notes: ui.itemNotesField.value.trim(),
        updatedAt: serverTimestamp()
      };
      try {
        if (id) {
          await updateDoc(doc(db, "items", id), payload);
          const idx = state.items.findIndex((x) => x.id === id);
          if (idx !== -1) state.items[idx] = { id, ...payload };
        } else {
          payload.createdAt = serverTimestamp();
          const refDoc = await addDoc(collection(db, "items"), payload);
          state.items.push({ id: refDoc.id, ...payload });
        }
        state.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "fr"));
        buildCategoryOptions();
        renderItems();
        closeDialog(ui.itemModal);
        setNotice("Élément enregistré.");
      } catch (err) {
        setNotice(`Erreur enregistrement : ${err.message}`, true);
      }
    });

    ui.importListBtn.addEventListener("click", () => {
      ui.importForm.reset();
      openDialog(ui.importModal);
    });
    ui.closeImportBtn.addEventListener("click", () => closeDialog(ui.importModal));
    ui.cancelImportBtn.addEventListener("click", () => closeDialog(ui.importModal));

    ui.importForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.user || !state.activeCollection) return;
      const fallbackCat = ui.importDefaultCat.value.trim();
      const lines = ui.importLinesArea.value
        .split(/\r?\n/)
        .map((l) => l.trim())
        .filter(Boolean);
      if (!lines.length) return;
      try {
        let added = 0;
        for (const line of lines) {
          const cols = line.split("|").map((p) => p.trim());
          const title = cols[0];
          if (!title) continue;
          const docData = {
            collectionId: state.activeCollection.id,
            title,
            ref: cols[1] || "",
            category: cols[2] || fallbackCat || "",
            notes: cols[3] || "",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          };
          const created = await addDoc(collection(db, "items"), docData);
          state.items.push({ id: created.id, ...docData });
          added += 1;
        }
        state.items.sort((a, b) => (a.title || "").localeCompare(b.title || "", "fr"));
        buildCategoryOptions();
        renderItems();
        closeDialog(ui.importModal);
        setNotice(`${added} élément(s) importé(s).`);
      } catch (err) {
        setNotice(`Erreur importation : ${err.message}`, true);
      }
    });

    onAuthStateChanged(auth, (user) => {
      state.user = user;
      syncRoleUI();
    });

    loadCollections();
  </script>
</body>
</html>
